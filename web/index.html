<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness AI Quest</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f4f7fb;
      color: #18212f;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 24px;
      align-items: stretch;
      margin-bottom: 24px;
    }
    .panel, .quest, .metric, .task, .habit {
      background: #ffffff;
      border: 1px solid #dde5ef;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(24, 33, 47, 0.08);
    }
    .panel { padding: 24px; }
    h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.15; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    p { margin: 0; color: #526173; line-height: 1.7; }
    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    label { display: grid; gap: 6px; font-size: 13px; color: #526173; }
    input, select {
      width: 100%;
      border: 1px solid #cbd6e2;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 15px;
      color: #18212f;
      background: #fff;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: #1677ff;
      cursor: pointer;
    }
    button:hover { background: #0f62d6; }
    .full { grid-column: 1 / -1; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .metric { padding: 16px; }
    .metric span { display: block; color: #526173; font-size: 13px; margin-bottom: 8px; }
    .metric strong { font-size: 24px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.6fr);
      gap: 20px;
    }
    .quest { padding: 20px; }
    .task, .habit { padding: 14px; margin-top: 12px; }
    .task-header { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eaf7ef;
      color: #197240;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .boss { border-color: #ffb4a2; background: #fff7f4; }
    .muted { color: #526173; font-size: 14px; }
    .stack { display: grid; gap: 20px; }
    .empty { padding: 24px; text-align: center; color: #526173; }
    @media (max-width: 860px) {
      .hero, .layout, .metrics { grid-template-columns: 1fr; }
      form { grid-template-columns: 1fr; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="panel">
        <h1>Fitness AI Quest</h1>
        <p>把每日训练变成任务、经验值、连续天数和每周 Boss 战。输入今天的时间、精力和设备，系统会自动生成一套更容易坚持的训练。</p>
      </div>
      <div class="panel">
        <form id="fitnessForm">
          <label>训练时间（分钟）<input name="time" type="number" min="8" max="120" value="30" /></label>
          <label>当前等级<input name="level" type="number" min="1" value="3" /></label>
          <label>目标
            <select name="goal">
              <option value="fat_loss">减脂</option>
              <option value="muscle_gain">增肌</option>
              <option value="mobility">久坐修复</option>
              <option value="stamina">体能</option>
            </select>
          </label>
          <label>精力
            <select name="energy">
              <option value="medium">中等</option>
              <option value="low">偏低</option>
              <option value="high">很好</option>
            </select>
          </label>
          <label>设备
            <select name="equipment">
              <option value="bodyweight">徒手</option>
              <option value="dumbbell">哑铃</option>
              <option value="band">弹力带</option>
            </select>
          </label>
          <label>连续天数<input name="streakDays" type="number" min="0" value="6" /></label>
          <label>已有 XP<input name="currentXp" type="number" min="0" value="720" /></label>
          <label>睡眠小时<input name="sleepHours" type="number" min="0" step="0.5" value="7" /></label>
          <button class="full" type="submit">生成今日任务</button>
        </form>
      </div>
    </section>

    <section class="metrics" id="metrics"></section>

    <section class="layout">
      <div class="quest" id="tasks">
        <div class="empty">点击生成今日任务，开始你的健身闯关。</div>
      </div>
      <aside class="stack">
        <div class="quest" id="coach"></div>
        <div class="quest" id="habits"></div>
      </aside>
    </section>
  </main>

  <script>
    const form = document.getElementById("fitnessForm");
    const metrics = document.getElementById("metrics");
    const tasks = document.getElementById("tasks");
    const coach = document.getElementById("coach");
    const habits = document.getElementById("habits");

    function formDataToPayload(formData) {
      return Object.fromEntries(Array.from(formData.entries()).map(([key, value]) => {
        const numericFields = ["time", "level", "streakDays", "currentXp", "sleepHours"];
        return [key, numericFields.includes(key) ? Number(value) : value];
      }));
    }

    function renderMetric(label, value) {
      return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
    }

    function render(data) {
      metrics.innerHTML = [
        renderMetric("等级", `Lv${data.progress.level}`),
        renderMetric("本次 XP", `+${data.progress.earnedXp}`),
        renderMetric("连续天数", `${data.progress.streakDays} 天`),
        renderMetric("消耗估算", `${data.session.estimatedCalories} kcal`)
      ].join("");

      tasks.innerHTML = `<h2>${data.plan.title}</h2>` + data.tasks.map(task => `
        <article class="task ${task.type === "boss" ? "boss" : ""}">
          <div class="task-header">
            <strong>${task.id}. ${task.name}</strong>
            <span class="badge">+${task.rewardXp} XP</span>
          </div>
          <p class="muted">${task.target} · ${task.duration} 分钟</p>
          <p>${task.note}</p>
        </article>
      `).join("");

      coach.innerHTML = `
        <h2>AI 教练</h2>
        <p>${data.aiCoach.summary}</p>
        <p>${data.suggestion}</p>
        <p class="muted">${data.aiCoach.nextAdjustment}</p>
      `;

      habits.innerHTML = `
        <h2>微习惯触发器</h2>
        ${data.plan.microHabits.map(habit => `<div class="habit">${habit}</div>`).join("")}
        <p class="muted">内容化灵感：${data.contentIdea}</p>
      `;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const payload = formDataToPayload(new FormData(form));
      const response = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      render(data);
    });
  </script>
</body>
</html>
